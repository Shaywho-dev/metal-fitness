version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mfa_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: MFA_GYM_REPORT
      MYSQL_USER: MFA_User
      MYSQL_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup_database.sql:/docker-entrypoint-initdb.d/01-create-db.sql:ro
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
